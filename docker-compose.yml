services:
  app:
    build: .
    env_file: .env
    ports:
      - "7860:7860"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:7860/health')",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
